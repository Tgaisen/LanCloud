name: "CI: Workflow Lint"

on:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 检查 Actions 配置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: 检查 YAML 语法
        run: |
          ruby -e 'require "yaml"; Dir[".github/**/*.{yml,yaml}"].sort.each { |file| YAML.load_file(file); puts "OK #{file}" }'
