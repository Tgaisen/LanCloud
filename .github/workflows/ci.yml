name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 与 pubspec.lock 的来源保持一致，确保 CI 使用 lock 中的确切版本。
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 代码格式检查（dart format）
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: 静态分析（flutter analyze）
        run: flutter analyze
      - name: 单元测试（flutter test）
        run: flutter test
