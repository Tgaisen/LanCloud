name: "CI: Windows"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  build:
    name: Windows release 构建检查
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 启用开发者模式（符号链接）
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty `
            -Path $key `
            -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
          pub-cache: ${{ github.event_name == 'push' }}
      - name: 获取锁定依赖
        run: flutter pub get --enforce-lockfile
      - name: 准备 NuGet CLI
        shell: pwsh
        run: |
          ./tools/release/install_nuget.ps1
      - name: 构建 Windows release
        run: flutter build windows --release --no-pub
      - name: Windows release 启动冒烟
        shell: pwsh
        run: |
          ./tools/release/smoke_windows.ps1 `
            -Executable 'build/windows/x64/runner/Release/lancloud.exe' `
            -TimeoutSeconds 15
