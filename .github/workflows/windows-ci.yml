name: "CI: Windows"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  build:
    name: Windows release 构建检查
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-windows
      - name: 构建 Windows 便携版
        shell: pwsh
        run: |
          ./tools/release/build_windows.ps1 `
            -SkipTests `
            -SkipPubGet `
            -CI
      - name: Windows 便携版启动冒烟
        shell: pwsh
        run: |
          $packageDir = Get-ChildItem `
            -LiteralPath 'outputs' `
            -Directory `
            -Filter 'LanCloud_windows_*_x64_portable' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (!$packageDir) {
            throw '找不到 Windows 便携版目录'
          }
          ./tools/release/smoke_windows.ps1 `
            -Executable (Join-Path $packageDir.FullName 'lancloud.exe') `
            -TimeoutSeconds 15
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: outputs/LanCloud_windows_*_x64_portable.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
