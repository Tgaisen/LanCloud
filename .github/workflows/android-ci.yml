name: "CI: Android"

# Gradle 依赖更新不会由现有的 Dart 测试覆盖，因此 Android 相关改动额外做一次
# release 构建，覆盖 R8 等只在 release 阶段出现的问题。缺少发布签名时沿用
# 项目现有的 debug 签名降级，只作编译校验，不读取任何发布签名 secrets。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  build:
    name: Android release 构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - name: 预生成 release 插件注册
        shell: bash
        run: flutter build apk --config-only --release
      - name: 构建 Android release APK
        shell: bash
        run: |
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          flutter build apk \
            --release \
            --no-pub \
            --split-per-abi \
            --dart-define=BUILD_TIME="$build_time" \
            --dart-define=GIT_COMMIT="$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  smoke:
    name: Android release 冷启动冒烟
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-apks
          path: apk
      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 启动模拟器并检查冷启动
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r "$GITHUB_WORKSPACE/apk/app-x86_64-release.apk"
            adb logcat -c
            adb shell am start -W -n com.lancloud.lancloud/.MainActivity
            sleep 15
            if ! adb shell pidof com.lancloud.lancloud; then adb logcat -d -t 400 | tail -n 200; exit 1; fi
