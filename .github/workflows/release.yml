name: Release

# 每次 push 到 main 都检查版本；tag / Release 已存在时跳过构建。
# 也可以在 Actions 页面手动触发，默认仍然创建 draft。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: 创建 draft Release（默认是）
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  EXPECTED_CERT_SHA256: 70BD4AA85322FE26E67202FAC31729BDE1F854FA1BD2FD52C88FFCAA02EDB5BB

jobs:
  validate:
    name: 校验
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 发布前校验
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/release/validate.ps1 `
            -CI `
            -SkipPubGet `
            -ExpectedCertSha256 $env:EXPECTED_CERT_SHA256

  android:
    name: Android 构建
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    # 2026-10-19: Linux runner 构建的 Android 包在 Android 15/17 上启动白屏；
    # 同一份代码在 Windows 工具链构建正常（本地实测）。先固定到 Windows 构建，
    # 等定位到 Linux Flutter/AOT 差异后再评估迁回 Ubuntu。
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # 不复用 Linux/旧 Flutter 构建缓存；Windows 全新工具链已实测可启动。
          cache: false
      - name: 获取依赖
        run: flutter pub get
      - name: 关闭 Kotlin 增量缓存（Windows CI）
        shell: pwsh
        run: |
          Add-Content -Path android/gradle.properties `
            -Value "`nkotlin.incremental=false" -Encoding ascii
      - name: 配置 release 签名
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $missing = @(
            foreach ($name in @(
              'KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'
            )) {
              if ([string]::IsNullOrEmpty(
                [Environment]::GetEnvironmentVariable($name)
              )) {
                $name
              }
            }
          )
          if ($missing.Count -gt 0) {
            throw "缺少 GitHub secret：$($missing -join ', ')。请按 docs/CI_RELEASE.md 配置。"
          }
          $keystore = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes(
            (Join-Path $env:GITHUB_WORKSPACE 'android/app/ci-release.jks'),
            $keystore
          )
          [IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'android/key.properties'),
            @(
              "storePassword=$env:KEYSTORE_PASSWORD",
              "keyPassword=$env:KEY_PASSWORD",
              "keyAlias=$env:KEY_ALIAS",
              'storeFile=ci-release.jks'
            )
          )
      - name: 构建并校验签名
        shell: pwsh
        run: |
          ./tools/release/build_android.ps1 `
            -SkipTests `
            -SkipPubGet `
            -ExpectedCertSha256 $env:EXPECTED_CERT_SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: outputs/LanCloud_android_*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 构建
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 启用开发者模式（符号链接）
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty `
            -Path $key `
            -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 准备 NuGet CLI
        shell: pwsh
        run: |
          $nugetDir = Join-Path $env:RUNNER_TEMP 'nuget'
          New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null
          Invoke-WebRequest `
            -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' `
            -OutFile (Join-Path $nugetDir 'nuget.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $nugetDir
      - name: 构建 Windows 便携版
        shell: pwsh
        run: |
          ./tools/release/build_windows.ps1 `
            -SkipTests `
            -SkipPubGet `
            -CI
      - uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: outputs/LanCloud_windows_*_x64_portable.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 Release
    needs: [validate, android, windows]
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: outputs
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: outputs
      - name: 创建/补齐 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
        run: |
          $draft = [System.Convert]::ToBoolean($env:RELEASE_DRAFT)
          ./tools/release/publish.ps1 -Draft:$draft
