name: 功能请求
description: 为这个项目提出一个新功能或改进想法
title: "[FEATURE] "
labels: ["enhancement"]
type: Feature
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 提交前请确认以下事项。
      options:
        - label: "已搜索[历史 issue](https://github.com/Tgaisen/LanCloud/issues)，并未发现相同的功能请求"
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能请求是否与某个问题有关？请描述一下。
      placeholder: 例如：每次……都需要手动……，非常不方便。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 请清晰简洁地描述你希望实现的功能。
      placeholder: 例如：希望支持……
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 请描述你考虑过的其他解决方案或功能；没有可以留空。
      placeholder: 例如：目前只能通过……绕过，但……
      render: text

  - type: textarea
    id: context
    attributes:
      label: 附加上下文
      description: 在此添加有关该功能请求的其他背景信息或截图。
