org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# 提前切到 AGP 9 的内置 Kotlin（Flutter 模板默认先写 false 保持旧行为）。
# 实测本项目的 app + 依赖在内置 Kotlin 下可构建；剩下的 KGP 警告来自
# desktop_drop / m3e_core 的构建脚本文本（Flutter 静态扫描判定），实际不会
# 执行。newDsl 仍保持 false：AGP 9 新 DSL 目前 Flutter Gradle 插件还不支持。
android.builtInKotlin=true
# 本应用通过 GitHub Releases 分发，不需要 Google Play「每个 ABI 不同
# versionCode」的规则。关掉 Flutter 默认的 ABI 偏移（armeabi-v7a +1000 /
# arm64-v8a +2000 / x86_64 +4000），让拆分包也直接用版本号公式算出的
# versionCode（见 docs/VERSIONING.md）。
force-version-code-ignoring-abi=true
